name: Deploy to Fly.io

# Deploys on every push to main, or manually from the Actions tab.
# First push will fail with "FLY_API_TOKEN not set" until the secret is added
# (repo Settings -> Secrets and variables -> Actions). Re-run after adding it.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Ensure public IP (one-time check)
        run: |
          IPS=$(flyctl ips list -a luz-voice-spike 2>&1)
          echo "$IPS"
          if echo "$IPS" | grep -qE '^[[:space:]]*v4[[:space:]]'; then
            echo "v4 already allocated, skipping"
          else
            flyctl ips allocate-v4 --shared -a luz-voice-spike
          fi
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
